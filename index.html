  :root {
    color-scheme: light dark;   /* 다크 모드 직접 지원 → 삼성 인터넷 등의 강제 반전 방지 */
    --navy: #24378c;
    --navy-ink: #1f2c6e;
    --cyan: #3fb6e0;
    --ink: #15181d;
    --sub: #4f5866;
    --off: #6b7380;   /* 흰 바탕 대비 4.5:1 이상 */
    --line: #e4e7ec;
    --soft: #f2f5fa;
    --pill: #1f2c6e;
    --hd: "Paperlogy", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: #fff; color: var(--ink);
    font-family: "Paperlogy", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px; line-height: 1.45; word-break: keep-all; overflow-wrap: break-word;
  }
  a { color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }

  /* 표지만 시안 디자인 (남색 그라데이션) */
  header.kv {
    position: relative; overflow: hidden; text-align: center; padding: 22px 0 24px; color: #fff;
    background:
      radial-gradient(90% 60% at 110% 40%, rgba(41,140,200,.45) 0%, rgba(41,140,200,0) 60%),
      radial-gradient(80% 50% at -20% 95%, rgba(32,150,200,.5) 0%, rgba(32,150,200,0) 60%),
      linear-gradient(170deg, #2b3f97 0%, #24378c 55%, #1f2f7a 100%);
  }
  header.kv svg.deco { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  header.kv svg.deco.wide { display: none; }
  @media (min-width: 700px), (orientation: landscape) and (max-height: 620px) {
    header.kv svg.deco { display: none; }
    header.kv svg.deco.wide { display: block; }
  }
  header.kv .wrap { position: relative; }
  .kicker { display: inline-block; margin: 0 0 10px; padding: 4.5px 20px 4.5px calc(20px + .12em);   /* 글자 간격이 마지막 글자 뒤에도 붙어 생기는 왼쪽 쏠림 보정 */ border-radius: 999px;
            border: 2px solid rgba(255,255,255,.75); font-family: var(--hd); font-size: 17px; font-weight: 700; letter-spacing: .12em; }
  h1 { margin: 0; font-family: var(--hd); font-weight: 800; line-height: 1.02; letter-spacing: -.01em; }
  h1 .y { display: block; font-size: clamp(56px, 18vw, 76px); }
  h1 .n { display: block; font-size: clamp(32px, 10vw, 44px); margin-top: 4px; }
  .date { font-family: var(--hd); font-weight: 600; margin: 16px 0 0; font-size: 19px; }
  .place { font-family: var(--hd); font-weight: 500; margin: 4px 0 0; font-size: 15px; color: rgba(255,255,255,.8); }
  .rule { width: 36px; height: 3px; background: #5cc8ec; border-radius: 2px; margin: 14px auto 12px; opacity: .85; }
  .host { margin: 0; font-family: var(--hd); font-weight: 500; font-size: 13px; color: rgba(255,255,255,.8); line-height: 1.6; }
  .host .hl { display: block; }
  .logos { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 22px; }
  .logos img { height: 24px; width: auto; display: block; }
  .logos img.jisi { height: 28px; }
  .logos img[hidden] { display: none; }
  @media (max-width: 359px) { .logos { gap: 9px; } .logos img { height: 19px; } .logos img.jisi { height: 23px; } }

  .inapp { display: none; background: #fff6dc; border-bottom: 1px solid #f0dfa8; text-align: center; padding: 10px 16px; font-size: 14px; }
  .inapp.on { display: block; }
  .inapp a { display: inline-block; margin-top: 6px; padding: 7px 14px; border-radius: 8px; background: var(--ink); color: #fff; text-decoration: none; font-weight: 600; }

  /* 아래는 흰 바탕 — 위에 붙는 검색·탭 */
  .bar { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.97); backdrop-filter: saturate(1.4) blur(6px); -webkit-backdrop-filter: saturate(1.4) blur(6px); border-bottom: 1px solid var(--line); }
  .bar.stuck { box-shadow: 0 4px 14px rgba(20,30,70,.08); }
  .bar .wrap { padding-top: 10px; padding-bottom: 10px; }
  .search { position: relative; }
  .search input {
    width: 100%; height: 46px; padding: 0 44px 0 16px; border-radius: 12px; border: 1.5px solid #cfd5df;
    background: #fff; color: var(--ink); font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none;
  }
  .search input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(36,55,140,.12); }
  .search input::placeholder { color: var(--off); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; border-radius: 50%;
                   background: transparent; font-size: 22px; line-height: 1; color: var(--sub); cursor: pointer; display: none; }
  .search.has .clear { display: block; }
  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  .tab {
    flex: 1 1 0; min-width: max-content; height: 40px; padding: 0 8px; border-radius: 999px;
    border: 1.5px solid #cfd5df; background: #fff; color: var(--sub);
    font-family: var(--hd); font-size: 14px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .tab[aria-selected="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }

  main { padding-bottom: 6px; }

  /* 쪽 제목: 시안 '행사 일정표' (남색 글자 + 하늘색 짧은 밑줄) */
  .ph { margin: 18px 0 12px; }
  .ph h2 { margin: 0; font-family: var(--hd); font-weight: 700; font-size: 24px; letter-spacing: -.01em; color: var(--navy-ink); }
  .ph .ul { position: relative; height: 2px; margin-top: 10px; background: #d5dbe6; }
  .ph .ul::before { content: ""; position: absolute; left: 0; top: -1px; width: 56px; height: 4px; background: var(--cyan); border-radius: 2px; }

  /* 소제목 띠: 시안 '| 1부 · 우수사례' (흰 바탕용으로 연한 남색 → 투명) */
  .band { display: flex; align-items: center; min-height: 36px; margin: 18px 0 4px; padding: 6px 12px;
          background: linear-gradient(90deg, #e3e8f6 0%, #e3e8f6 55%, rgba(227,232,246,0) 100%);
          color: var(--navy-ink); font-family: var(--hd); font-weight: 700; font-size: 16px; line-height: 1.3; }
  .band::before { content: ""; flex: none; width: 3px; height: 17px; background: var(--navy-ink); margin-right: 9px; }

  .lab { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--pill); color: #fff;
         font-family: var(--hd); font-weight: 700; font-size: 12px; line-height: 1.6; vertical-align: 1px; }

  /* 자료 목록 */
  .feat { display: flex; align-items: center; gap: 12px; margin: 0 0 6px; padding: 16px 14px; border-radius: 14px; background: var(--soft); }
  .feat .txt { flex: 1; min-width: 0; }
  .feat .t { font-family: var(--hd); font-size: 19px; font-weight: 800; color: var(--navy-ink); }
  .feat .s { font-size: 13px; color: var(--sub); margin-top: 2px; }

  .item { display: flex; align-items: center; gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .item .txt { flex: 1; min-width: 0; }
  .item .lab { margin-bottom: 5px; }
  .item .t { font-family: var(--hd); font-weight: 600; font-size: 16px; line-height: 1.4; }
  .item .s { font-size: 14px; color: var(--sub); margin-top: 2px; }
  .item .m { font-size: 12px; color: var(--off); margin-top: 2px; }
  mark { background: #fff1a8; color: inherit; border-radius: 2px; padding: 0 1px; }

  .btns { flex: none; display: flex; gap: 6px; }
  .btn {
    display: flex; align-items: center; justify-content: center; width: 54px; height: 44px; border-radius: 10px;
    font-family: var(--hd); font-size: 15px; font-weight: 700; text-decoration: none;
    border: 1.5px solid var(--navy); color: var(--navy); background: #fff; -webkit-tap-highlight-color: transparent;
  }
  .btn.fill { background: var(--navy); color: #fff; }
  .btn.wide { width: 114px; }
  .btn:active { transform: translateY(1px); }
  .btn.off { width: 114px; border-color: var(--line); color: var(--off); background: #fafbfc; font-size: 14px; font-weight: 600; }

  .empty { text-align: center; color: var(--sub); padding: 36px 0; font-size: 15px; display: none; }
  .empty.on { display: block; }

  /* 자료 앞 시간 (행사 일정 탭 대신) — 연한 하늘색 칩으로 눈에 띄게 */
  .item { flex-wrap: wrap; row-gap: 0; }
  .item > .tm { flex: 0 0 100%; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px; margin-bottom: 5px; }
  .item .lab { margin: 0; }
  /* 라벨(기조 강연·발제·발표) = 형광펜 강조 굵은 글씨, 시간 = 구분선 뒤 보통 굵기 (알약 모양 쓰지 않음) */
  .lab.big {
    display: inline; padding: 0 3px; border-radius: 0; color: var(--navy-ink);
    background: linear-gradient(transparent 56%, #b8e3f6 56%, #b8e3f6 92%, transparent 92%);
    font-family: var(--hd); font-size: 18px; font-weight: 800; line-height: 1.3; letter-spacing: -.005em;
  }
  .time {
    display: inline-flex; align-items: baseline; gap: 1px; padding: 0; background: none;
    color: var(--navy); font-family: var(--hd); font-variant-numeric: tabular-nums; line-height: 1.3;
  }
  .lab.big + .time { padding-left: 10px; margin-left: 2px; border-left: 1.5px solid #c8cfdb; }
  .time b { font-weight: 700; font-size: 15px; }
  .time i { font-style: normal; font-weight: 600; font-size: 13px; color: #5d6886; }
  .item.info .time { color: var(--sub); }
  .item.info .time i { color: var(--off); }
  .band .bt { flex: 1; min-width: 0; }
  .band .btime { flex: none; margin-left: 10px; font-size: 13px; font-weight: 700; color: var(--navy); opacity: .85; font-variant-numeric: tabular-nums; }
  .item.info { padding: 11px 0; }
  .item.info .t { font-weight: 600; color: var(--sub); }

  footer { margin: 26px auto calc(36px + env(safe-area-inset-bottom)); text-align: center; font-size: 13px; color: var(--sub); }
  footer p { margin: 4px 0; }

  /* ── 키 작은 휴대폰(아이폰 SE 1세대 등): 첫 자료가 첫 화면에 걸리도록 제목 여백만 줄임 */
  @media (orientation: portrait) and (max-height: 600px) { .ph { margin: 12px 0 10px; } }

  /* ── 태블릿: 글줄을 조금 넓게 */
  @media (min-width: 700px) {
    .wrap { max-width: 680px; }
    .item .t { font-size: 17px; }

    toast("기본 브라우저에서 열고 있습니다. 열린 화면에서 [저장]을 다시 눌러 주세요.");
    location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
    return;
  }
  if (IN_APP) {
    toast("앱 안에서는 저장이 막힐 수 있습니다. 오른쪽 위 메뉴에서 '다른 브라우저로 열기'를 눌러 주세요.", 6000);
  }
  if (btn.dataset.busy) return;
  btn.dataset.busy = "1"; const label = btn.textContent; btn.textContent = "받는 중";
  try {
    const res = await fetch(it.file, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    const blob = new Blob([await res.arrayBuffer()], { type: "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = it.saveAs; a.rel = "noopener"; a.style.display = "none";
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast(IS_IOS ? "내려받기를 시작했습니다. '파일' 앱 > 다운로드 폴더에서 볼 수 있습니다."
                 : "내려받기를 시작했습니다. '내 파일' > 다운로드 폴더에서 볼 수 있습니다.");
  } catch (err) {
    // 받기 실패 시: 원래 링크로 (브라우저 기본 동작)
    location.href = it.file;
  } finally {
    btn.textContent = label; delete btn.dataset.busy;
  }
}


// ── 보기: PDF.js 로 페이지 안에서 연다 (처음 누를 때만 라이브러리 받음)
const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/";
let pdfjsReady = null;
function loadPdfjs() {
  if (!pdfjsReady) pdfjsReady = new Promise((ok, bad) => {
    const sc = document.createElement("script"); sc.src = PDFJS + "build/pdf.min.js";
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "build/pdf.worker.min.js"; ok(window.pdfjsLib); };
    sc.onerror = () => { pdfjsReady = null; bad(new Error("pdfjs")); };
    document.head.append(sc);
  });
  return pdfjsReady;
}
const V = { box: document.getElementById("viewer"), pages: document.getElementById("vpages"), title: document.getElementById("vtitle"),
            pg: document.getElementById("vpg"), save: document.getElementById("vsave"), back: document.getElementById("vback"),
            doc: null, it: null, io: null, pushed: false, lastFocus: null, token: 0 };
V.back.addEventListener("click", () => { if (V.pushed) history.back(); else closeViewer(); });
V.save.addEventListener("click", e => { if (V.it) saveFile(e, V.it, V.save); });
window.addEventListener("popstate", () => { if (!V.box.hidden) closeViewer(true); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !V.box.hidden) V.back.click(); });

function closeViewer(fromPop) {
  V.token++;
  if (V.io) V.io.disconnect();
  if (V.doc) { V.doc.destroy(); V.doc = null; }
  V.pages.replaceChildren(); V.box.hidden = true; document.documentElement.style.overflow = "";
  if (!fromPop && V.pushed) history.back();
  V.pushed = false;
  if (V.lastFocus) V.lastFocus.focus({ preventScroll: true });
}

async function openViewer(e, it) {
  e.preventDefault();
  const token = ++V.token;
  V.it = it; V.lastFocus = e.currentTarget;
  V.title.textContent = ((it.label ? it.label + " " : "") + it.title).trim();
  V.pg.textContent = "여는 중…";
  V.save.href = it.file; V.save.setAttribute("download", it.saveAs);
  V.pages.replaceChildren(); V.pages.scrollTop = 0;
  V.box.hidden = false; document.documentElement.style.overflow = "hidden";
  if (!V.pushed) { history.pushState({ viewer: it.file }, ""); V.pushed = true; }
  V.back.focus({ preventScroll: true });
  try {
    const lib = await loadPdfjs();
    const doc = await lib.getDocument({ url: it.file, cMapUrl: PDFJS + "cmaps/", cMapPacked: true }).promise;
    if (token !== V.token) { doc.destroy(); return; }
    V.doc = doc;
    const first = await doc.getPage(1), vp1 = first.getViewport({ scale: 1 });
    const ratio = vp1.height / vp1.width;
    const holders = [];
    for (let i = 1; i <= doc.numPages; i++) {
      const d = el("div", "vpage"); d.dataset.n = i; d.style.aspectRatio = `1 / ${ratio}`;
      V.pages.append(d); holders.push(d);
    }
    V.pg.textContent = `1 / ${doc.numPages}쪽`;
    // 화면 근처 쪽만 그리고, 멀어진 쪽은 지워 메모리 아낌 (자료집이 길어도 휴대폰이 버티게)
    const render = async d => {
      if (d.dataset.state) return; d.dataset.state = "busy";
      try {
        const page = await doc.getPage(+d.dataset.n);
        const v1 = page.getViewport({ scale: 1 });
        d.style.aspectRatio = `${v1.width} / ${v1.height}`;
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        const scale = (d.clientWidth * dpr) / v1.width;
        const vp = page.getViewport({ scale });
        const c = document.createElement("canvas"); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
        await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
        if (token !== V.token || d.dataset.state !== "busy") return;
        d.replaceChildren(c); d.dataset.state = "done";
      } catch (_) { delete d.dataset.state; }
    };
    V.io = new IntersectionObserver(ents => {
      for (const en of ents) {
        if (en.isIntersecting) render(en.target);
        else if (en.target.dataset.state === "done") { en.target.replaceChildren(); delete en.target.dataset.state; }
      }
    }, { root: V.pages, rootMargin: "1200px 0px" });
    holders.forEach(d => V.io.observe(d));
    // 쪽수 표시
    const onScroll = () => {
      const mid = V.pages.scrollTop + V.pages.clientHeight / 3;
      let n = 1; for (const d of holders) { if (d.offsetTop <= mid) n = +d.dataset.n; else break; }
      V.pg.textContent = `${n} / ${doc.numPages}쪽`;
    };
    V.pages.onscroll = onScroll;
  } catch (err) {
    if (token !== V.token) return;
    V.pg.textContent = "";
    const m = el("div", "vmsg"); m.append("이 화면에서 자료를 열지 못했습니다.", el("br"), "아래 버튼으로 바로 열거나 위의 [저장]을 눌러 주세요.");
    const a = el("a", null, "자료 바로 열기"); a.href = it.file; a.target = "_blank"; a.rel = "noopener";
    m.append(el("br"), a); V.pages.replaceChildren(m);
  }
}

function btns(it) {
  const box = el("div", "btns");
  if (it.url) {
    const a = el("a", "btn fill wide", "열기"); a.href = it.url; a.target = "_blank"; a.rel = "noopener"; box.append(a);
  } else if (it.ready) {
    const v = el("a", "btn", "보기"); v.href = it.file; v.target = "_blank"; v.rel = "noopener"; v.setAttribute("aria-label", it.title + " 보기");
    v.addEventListener("click", e => openViewer(e, it));
    const d = el("a", "btn fill", "저장"); d.href = it.file; d.setAttribute("download", it.saveAs); d.setAttribute("aria-label", it.title + " 저장");
    d.addEventListener("click", e => saveFile(e, it, d));
    box.append(v, d);
  } else {
    box.append(el("span", "btn off", "준비 중"));
  }
  return box;
}

// ── 표지
const ev = DATA.event;
const h1 = document.getElementById("ev-title");
const m = ev.title.match(/^(\d{4})\s*(.*)$/);
const name = m ? m[2].replace("성과포럼", "성과 포럼") : ev.title;   // 시안 표기: '앵커 성과 포럼'
if (m) h1.append(el("span", "y", m[1]), el("span", "n", name)); else h1.textContent = ev.title;
document.getElementById("ev-date").textContent = ev.date;
document.getElementById("ev-place").textContent = ev.place;
const host = document.getElementById("ev-host");
[].concat(ev.host || []).forEach(t => host.append(el("span", "hl", t)));

// ── 탭: 전체 / 각 부(자료 있는 부만) / 설문 — 행사 일정은 목록 안의 시간으로 대신함
const groups = (DATA.sections || []).map((s, i) => ({ id: "s" + i, title: s.title, time: s.time, tab: s.tab, items: s.items }));
const links = (DATA.links || []).filter(l => l.url);
if (links.length) groups.push({ id: "links", title: "설문", tab: "설문", items: links });
const TABS = [{ id: "all", tab: "전체" }, ...groups.filter(g => g.tab !== false)];

let cur = "all", query = "";
const tabsBox = document.getElementById("tabs");
for (const t of TABS) {
  const b = el("button", "tab", t.tab || t.title);
  b.type = "button"; b.setAttribute("role", "tab"); b.dataset.id = t.id;
  b.addEventListener("click", () => { cur = t.id; render(); window.scrollTo({ top: Math.min(window.scrollY, document.getElementById("bar").offsetTop), behavior: "smooth" }); });
  tabsBox.append(b);
}

const main = document.getElementById("main"), empty = document.getElementById("empty");
function pageHead(text) {
  const h = el("div", "ph"); h.append(el("h2", null, text), el("div", "ul")); return h;
}
function band(g) {
  const b = el("div", "band"); b.append(el("span", "bt", g.title));
  if (g.time) b.append(el("span", "btime", g.time));
  return b;
}
function row(it, g) {
  const r = el("div", "item" + (it.info ? " info" : "")), tx = el("div", "txt");
  const time = g && it.time === g.time ? "" : it.time;   // 띠에 같은 시간이 있으면 생략
  if (time || it.label) {
    const tm = el("div", "tm");
    if (it.label) tm.append(el("span", "lab big", it.label));
    if (time) {
      const [st, en] = time.split("~");
      const c = el("span", "time"); c.append(el("b", null, st));
      if (en) c.append(el("i", null, "~" + en));
      tm.append(c);
    }
    r.append(tm);   // 라벨·시간 줄은 버튼 칸과 따로, 가로 전체 사용
  }
  const t = el("div", "t"); highlight(t, it.title, query); tx.append(t);
  if (it.sub) { const s = el("div", "s"); highlight(s, it.sub, query); tx.append(s); }
  r.append(tx);
  if (!it.info) r.append(btns(it));
  return r;
}

function render() {
  for (const b of tabsBox.children) b.setAttribute("aria-selected", String(b.dataset.id === cur));
  main.replaceChildren();
  let shown = 0;
  main.append(pageHead("발표 자료"));
  const f = DATA.featured;
  if (f && cur === "all" && matches(f.title, query)) {
    const box = el("div", "feat"), tx = el("div", "txt");
    tx.append(el("div", "t", f.title));
    box.append(tx, btns(f)); main.append(box); shown++;
  }
  for (const g of groups) {
    if (cur !== "all" && cur !== g.id) continue;
    // 검색 중엔 자료만, 평소엔 개회·휴식 같은 시간 줄도 함께
    const hits = g.items.filter(it => query ? !it.info && matches(g.title + " " + (it.label || "") + " " + it.title + " " + (it.sub || ""), query) : true);
    if (!hits.length) continue;
    main.append(band(g));
    hits.forEach(it => main.append(row(it, g)));
    shown += hits.filter(it => !it.info).length;
  }
  if (!shown) main.replaceChildren();
  empty.textContent = query ? `'${query}'에 맞는 자료가 없습니다.` : "";
  empty.classList.toggle("on", shown === 0);
}

const q = document.getElementById("q"), sbox = document.getElementById("search");
q.addEventListener("input", () => {
  query = q.value.trim(); sbox.classList.toggle("has", !!q.value);
  render();
});
q.addEventListener("keydown", e => { if (e.key === "Enter") q.blur(); });
document.getElementById("clear").addEventListener("click", () => { q.value = ""; query = ""; sbox.classList.remove("has"); render(); q.focus(); });

const bar = document.getElementById("bar");
new IntersectionObserver(([e]) => bar.classList.toggle("stuck", e.intersectionRatio < 1), { threshold: [1], rootMargin: "-1px 0px 0px 0px" }).observe(bar);

render();

// 카카오톡·네이버 등 앱 안 브라우저에서는 저장이 막히는 경우가 있어 안내
(function () {
  const ua = navigator.userAgent, box = document.getElementById("inapp");
  if (/KAKAOTALK/i.test(ua)) {
    box.append(el("div", null, "카카오톡 안에서는 파일 저장이 안 될 수 있습니다."));
    const a = el("a", null, "기본 브라우저로 열기");
    a.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
    box.append(a); box.classList.add("on");
  } else if (/NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(ua)) {
    box.append(el("div", null, "앱 안에서 열려 저장이 안 되면, 오른쪽 위 메뉴에서 '다른 브라우저로 열기'를 눌러 주세요."));
    box.classList.add("on");
  }
})();
</script>
