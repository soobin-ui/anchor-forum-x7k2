<style>html.fl body { visibility: hidden; }
  /* 발표자·토론자 */
  .ppl { margin-top: 8px; }
  .pg { display: flex; align-items: baseline; gap: 8px; }
  .pg + .pg { margin-top: 4px; }
  .pg .role { flex: none; font-family: var(--hd); font-size: 15px; font-weight: 700; color: var(--navy); padding-right: 8px;
              border-right: 1.5px solid #c8cfdb; line-height: 1.2; }
  .plines { flex: 1; min-width: 0; }
  .pl { line-height: 1.55; }
  /* 이름+직함은 한 덩어리: 자리가 모자라면 함께 다음 줄로, 직함이 아주 길 때만 이름 아래로 */
  .pp { display: inline-flex; flex-wrap: wrap; align-items: baseline; column-gap: 4px; margin-right: 12px; max-width: 100%; vertical-align: top; }
  .pp b { white-space: nowrap; }
  .pp .pt { word-break: keep-all; max-width: 100%; }
  .pp b { font-family: var(--hd); font-weight: 700; font-size: 16px; color: var(--ink); }
  .pp .pt { font-size: 15px; color: var(--sub); }
  @media (prefers-color-scheme: dark) { .pg .role { border-right-color: #3a4372; } }

  /* 휴대폰(360~479px): [보기]·[저장]을 오른쪽에 위아래로 쌓아 글자 칸을 넓힘
     → '발표' 꼬리표가 붙어도 '이희제 강원LRS공유대학본부 본부장'이 세 줄로 꺾이지 않게 */
  @media (min-width: 360px) and (max-width: 479px) {
    .item .btns { flex-direction: column; gap: 6px; }
    .item .btns .btn { width: 60px; height: 42px; }
  }

  /* 360px 미만(아이폰 SE 1세대·폴드 접힘): 버튼을 제목 아래로 넓게 → 제목 칸 넓히고 누르기 쉽게 */
  @media (max-width: 359px) {
    .item .btns { flex: 1 0 100%; margin-top: 10px; }
    .item .btns .btn { flex: 1; width: auto; }
    .feat { flex-wrap: wrap; }
    .feat .btns { flex: 1 0 100%; }
    .feat .btns .btn { flex: 1; width: auto; }
  }

  /* 문장 끊김 방지: 줄 길이를 고르게 → 마지막 줄에 한 단어만 떨어지지 않게 (크롬·삼성·아이폰 17.5+) */
  .item .t .seg { display: block; text-wrap: balance; }
  .item .t, .band .bt, .ph h2, .feat .t, .vtitle, .place, .empty { text-wrap: balance; }
  footer p, .toast, .inapp div, .vmsg { text-wrap: pretty; }
  .nw { white-space: nowrap; }

  /* 1부·2부 띠: '1부'+시간 / 다음 줄에 제목 */
  .band.two { align-items: stretch; padding: 9px 12px 10px; }
  .band.two::before { height: auto; align-self: stretch; }
  .band.two .bt { display: flex; flex-direction: column; gap: 3px; }
  .band.two .b1 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .band.two .btime { margin-left: auto; }
  .band.two .part { font-size: 15px; font-weight: 800; color: var(--navy); letter-spacing: .02em; }
  .band.two .b2 { font-size: 17px; font-weight: 700; text-wrap: balance; }
  .band.two .b3 { font-size: 15px; font-weight: 500; color: var(--sub); text-wrap: balance; word-break: keep-all; }
</style>

  :root {
    color-scheme: light dark;   /* 다크 모드 직접 지원 → 삼성 인터넷 등의 강제 반전 방지 */
    --navy: #24378c;
    --navy-ink: #1f2c6e;
    --cyan: #3fb6e0;
    --ink: #15181d;
    --sub: #4f5866;
    --off: #6b7380;   /* 흰 바탕 대비 4.5:1 이상 */
    --line: #e4e7ec;
    --soft: #f2f5fa;
    --pill: #1f2c6e;
    --hd: "Paperlogy", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: #fff; color: var(--ink);
    font-family: "Paperlogy", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px; line-height: 1.45; word-break: keep-all; overflow-wrap: break-word;
  }
  a { color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }

  /* 표지만 시안 디자인 (남색 그라데이션) */
  header.kv {
    position: relative; overflow: hidden; text-align: center; padding: 22px 0 24px; color: #fff;
    background:
      radial-gradient(90% 60% at 110% 40%, rgba(41,140,200,.45) 0%, rgba(41,140,200,0) 60%),
      radial-gradient(80% 50% at -20% 95%, rgba(32,150,200,.5) 0%, rgba(32,150,200,0) 60%),
      linear-gradient(170deg, #2b3f97 0%, #24378c 55%, #1f2f7a 100%);
  }
  header.kv svg.deco { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  header.kv svg.deco.wide { display: none; }
  @media (min-width: 700px), (orientation: landscape) and (max-height: 620px) {
    header.kv svg.deco { display: none; }
    header.kv svg.deco.wide { display: block; }
  }
  header.kv .wrap { position: relative; }
  .kicker { display: inline-block; margin: 0 0 10px; padding: 4.5px 20px 4.5px calc(20px + .12em);   /* 글자 간격이 마지막 글자 뒤에도 붙어 생기는 왼쪽 쏠림 보정 */ border-radius: 999px;
            border: 2px solid rgba(255,255,255,.75); font-family: var(--hd); font-size: 17px; font-weight: 700; letter-spacing: .12em; }
  h1 { margin: 0; font-family: var(--hd); font-weight: 800; line-height: 1.02; letter-spacing: -.01em; }
  /* 표지 = 리플렛 표지와 동일: 2026 / 앵커(가장 크게) / 성과포럼 */
  h1 .l { display: block; }
  /* 리플렛 표지 비율 그대로: 앵커(SemiBold) 기준, 2026 = ×0.412(ExtraBold), 성과포럼 = ×0.515(Bold)
     → '앵커'와 '성과포럼' 폭이 같아짐. 폭·높이 중 작은 쪽에 맞춰 키 작은 휴대폰에서도 첫 화면에 자료가 걸리게 */
  h1 { --A: clamp(64px, min(30vw, 13.6vh), 124px); letter-spacing: 0; }
  h1 .l1 { font-size: calc(var(--A) * .405); font-weight: 800; }
  h1 .l2 { font-size: var(--A); font-weight: 600; line-height: .95; margin-top: 2px; }
  h1 .l3 { font-size: calc(var(--A) * .50); font-weight: 700; margin-top: 2px; }
  .date { font-family: var(--hd); font-weight: 700; margin: 0; font-size: 22px; }
  .place { font-family: var(--hd); font-weight: 500; margin: 4px 0 0; font-size: 17px; color: rgba(255,255,255,.85); }
  .rule { width: 76px; height: 3px; background: #3fb6e0; border-radius: 2px; margin: 14px auto 12px; }
  .host { margin: 12px 0 0; font-family: var(--hd); font-weight: 500; font-size: 15px; color: rgba(255,255,255,.8); line-height: 1.6; }
  .host .hl { display: block; }
  .logos { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 22px; }
  .logos img { height: 24px; width: auto; display: block; }
  .logos img.jisi { height: 28px; }
  .logos img.nrf { height: 25.4px; } /* 흰 테두리 여백만큼 보정 */
  .logos img[hidden] { display: none; }
  @media (max-width: 359px) { .logos { gap: 9px; } .logos img { height: 19px; } .logos img.jisi { height: 23px; } .logos img.nrf { height: 20.1px; } }

  .inapp { display: none; background: #fff6dc; border-bottom: 1px solid #f0dfa8; text-align: center; padding: 10px 16px; font-size: 14px; }
  .inapp.on { display: block; }
  .inapp a { display: inline-block; margin-top: 6px; padding: 7px 14px; border-radius: 8px; background: var(--ink); color: #fff; text-decoration: none; font-weight: 600; }

  /* 아래는 흰 바탕 — 위에 붙는 검색·탭 */
  .bar { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.97); backdrop-filter: saturate(1.4) blur(6px); -webkit-backdrop-filter: saturate(1.4) blur(6px); border-bottom: 1px solid var(--line); }
  .bar.stuck { box-shadow: 0 4px 14px rgba(20,30,70,.08); }
  .bar .wrap { padding-top: 10px; padding-bottom: 10px; }
  .search { position: relative; }
  .search input {
    width: 100%; height: 50px; padding: 0 44px 0 16px; border-radius: 12px; border: 1.5px solid #cfd5df;
    background: #fff; color: var(--ink); font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; font-size: 17px; outline: none; -webkit-appearance: none; appearance: none;
  }
  .search input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(36,55,140,.12); }
  .search input::placeholder { color: var(--off); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; border-radius: 50%;
                   background: transparent; font-size: 22px; line-height: 1; color: var(--sub); cursor: pointer; display: none; }
  .search.has .clear { display: block; }
  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  .tab {
    flex: 1 1 0; min-width: max-content; height: 44px; padding: 0 8px; border-radius: 999px;
    border: 1.5px solid #cfd5df; background: #fff; color: var(--sub);
    font-family: var(--hd); font-size: 16px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .tab[aria-selected="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }

  main { padding-bottom: 6px; }

  /* 쪽 제목: 시안 '행사 일정표' (남색 글자 + 하늘색 짧은 밑줄) */
  .ph { margin: 18px 0 12px; }
  .ph h2 { margin: 0; font-family: var(--hd); font-weight: 700; font-size: 24px; letter-spacing: -.01em; color: var(--navy-ink); }
  .ph .ul { position: relative; height: 2px; margin-top: 10px; background: #d5dbe6; }
  .ph .ul::before { content: ""; position: absolute; left: 0; top: -1px; width: 56px; height: 4px; background: var(--cyan); border-radius: 2px; }

  /* 소제목 띠: 시안 '| 1부 · 우수사례' (흰 바탕용으로 연한 남색 → 투명) */
  .band { display: flex; align-items: center; min-height: 36px; margin: 18px 0 4px; padding: 6px 12px;
          background: linear-gradient(90deg, #e3e8f6 0%, #e3e8f6 55%, rgba(227,232,246,0) 100%);
          color: var(--navy-ink); font-family: var(--hd); font-weight: 700; font-size: 17px; line-height: 1.3; }
  .band::before { content: ""; flex: none; width: 3px; height: 17px; background: var(--navy-ink); margin-right: 9px; }

  .lab { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--pill); color: #fff;
         font-family: var(--hd); font-weight: 700; font-size: 15px; line-height: 1.6; vertical-align: 1px; }

  /* 자료 목록 */
  .feat { display: flex; align-items: center; gap: 12px; margin: 0 0 6px; padding: 16px 14px; border-radius: 14px; background: var(--soft); }
  .feat .txt { flex: 1; min-width: 0; }
  .feat .t { font-family: var(--hd); font-size: 20px; font-weight: 800; color: var(--navy-ink); }
  .feat .s { font-size: 15px; color: var(--sub); margin-top: 2px; }

  .item { display: flex; align-items: center; gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .item .txt { flex: 1; min-width: 0; }
  .item .lab { margin-bottom: 5px; }
  .item .t { font-family: var(--hd); font-weight: 600; font-size: 17px; line-height: 1.45; white-space: pre-line; }
  .item .s { font-size: 15px; color: var(--sub); margin-top: 2px; white-space: pre-line; }
  .item .m { font-size: 15px; color: var(--off); margin-top: 2px; }
  mark { background: #fff1a8; color: inherit; border-radius: 2px; padding: 0 1px; }

  .btns { flex: none; display: flex; gap: 6px; }
  .btn {
    display: flex; align-items: center; justify-content: center; width: 56px; height: 46px; border-radius: 10px;
    font-family: var(--hd); font-size: 16px; font-weight: 700; text-decoration: none;
    border: 1.5px solid var(--navy); color: var(--navy); background: #fff; -webkit-tap-highlight-color: transparent;
  }
  .btn.fill { background: var(--navy); color: #fff; }
  .btn.wide { width: 118px; }
  .btn:active { transform: translateY(1px); }
  .btn.off { width: 118px; border-color: var(--line); color: var(--off); background: #fafbfc; font-size: 16px; font-weight: 600; }

  .empty { text-align: center; color: var(--sub); padding: 36px 0; font-size: 15px; display: none; }
  .empty.on { display: block; }

  /* 자료 앞 시간 (행사 일정 탭 대신) — 연한 하늘색 칩으로 눈에 띄게 */

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function mb(bytes) {
  const v = bytes / 1048576;
  return v < 0.1 ? "0.1MB" : (v < 10 ? v.toFixed(1) : Math.round(v)) + "MB";
}

// ── 검색: 띄어쓰기 무시, 초성(ㅌㄹ → 토론) 검색 지원
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
function norm(s) { return (s || "").toLowerCase().replace(/[\s·.,()\[\]①②③④⑤-]/g, ""); }
function chosung(s) {
  let r = "";
  for (const ch of s) { const c = ch.charCodeAt(0) - 0xAC00; r += (c >= 0 && c <= 11171) ? CHO[Math.floor(c / 588)] : ch; }
  return r;
}
function isCho(s) { return /^[ㄱ-ㅎ]+$/.test(s); }
function matches(hay, q) {
  const nq = norm(q);
  if (!nq) return true;
  const h = norm(hay);
  return isCho(nq) ? chosung(h).includes(nq) : h.includes(nq);
}
// 단어마다 줄바꿈 없는 묶음으로 → '시·도-대학' 같은 단어가 중간(·, -)에서 끊기지 않게
function words(node, text) {
  text.split(/(\s+)/).forEach(w => { if (!w) return; if (/^\s+$/.test(w)) node.append(w); else node.append(el("span", "nw", w)); });
}
function highlight(node, text, q) {
  const nq = (q || "").trim();
  if (!nq || isCho(norm(nq))) { words(node, text); return; }
  const i = text.toLowerCase().indexOf(nq.toLowerCase());
  if (i < 0) { words(node, text); return; }
  node.append(text.slice(0, i), el("mark", null, text.slice(i, i + nq.length)), text.slice(i + nq.length));
}

  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastBox.classList.remove("on"), ms);
}
async function saveFile(e, it, btn) {
  e.preventDefault();
  if (IN_KAKAO) {   // 카카오톡 안에서는 내려받기가 막힘 → 기본 브라우저로 열기
    toast("기본 브라우저에서 열고 있습니다. 열린 화면에서 [저장]을 다시 눌러 주세요.");
    location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
    return;
  }
  if (IN_APP) {
    toast("앱 안에서는 저장이 막힐 수 있습니다. 오른쪽 위 메뉴에서 '다른 브라우저로 열기'를 눌러 주세요.", 6000);
  }
  if (btn.dataset.busy) return;
  btn.dataset.busy = "1"; const label = btn.textContent; btn.textContent = "받는 중";
  try {
    const res = await fetch(it.file, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    // 받는 동안 버튼에 진행률(%) 표시 → 큰 파일도 멈춘 것처럼 보이지 않게
    const total = +res.headers.get("content-length") || 0, parts = [];
    let got = 0;
    if (res.body && res.body.getReader) {
      const rd = res.body.getReader();
      for (;;) {
        const { done, value } = await rd.read(); if (done) break;
        parts.push(value); got += value.length;
        if (total > 1048576) btn.textContent = Math.min(99, Math.floor(got / total * 100)) + "%";
      }
    } else { parts.push(await res.arrayBuffer()); }
    const blob = new Blob(parts, { type: "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = it.saveAs; a.rel = "noopener"; a.style.display = "none";
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast(IS_IOS ? "내려받기를 시작했습니다. '파일' 앱 > 다운로드 폴더에서 볼 수 있습니다."
                 : "내려받기를 시작했습니다. '내 파일' > 다운로드 폴더에서 볼 수 있습니다.");
  } catch (err) {
    // 받기 실패 시: 원래 링크로 (브라우저 기본 동작)
    location.href = it.file;
  } finally {
    btn.textContent = label; delete btn.dataset.busy;
  }
}

function loadPdfjs() {

}
const V = { box: document.getElementById("viewer"), pages: document.getElementById("vpages"), title: document.getElementById("vtitle"),

async function openViewer(e, it) {
  e.preventDefault();
  const token = ++V.token;
  V.it = it; V.lastFocus = e.currentTarget;
  V.title.textContent = ((it.label ? it.label + " " : "") + it.title).trim();

    const lib = await loadPdfjs();

      url: it.file, cMapUrl: PDFJS + "cmaps/", cMapPacked: true,
      disableAutoFetch: true, disableStream: true, rangeChunkSize: 262144,   // 보이는 쪽에 필요한 부분만 받기

    // 화면 근처 쪽만 그리고, 멀어진 쪽은 지워 메모리 아낌 (자료집이 길어도 휴대폰이 버티게)

        const page = await doc.getPage(+d.dataset.n);

        const dpr = Math.min(window.devicePixelRatio || 1, 2);

      if (busy) return; busy = true;
      try {
        while (want.size && token === V.token) {
          const mid = V.pages.scrollTop + V.pages.clientHeight / 2;
          let best = null, bd = Infinity;
          for (const d of want) { const dd = Math.abs(d.offsetTop + d.offsetHeight / 2 - mid); if (dd < bd) { bd = dd; best = d; } }
          want.delete(best); await render(best);

      for (const en of ents) {

const main = document.getElementById("main"), empty = document.getElementById("empty");
function pageHead(text) {
  const h = el("div", "ph"); h.append(el("h2", null, text), el("div", "ul")); return h;
}
function band(g) {
  const b = el("div", "band");
  const m = g.title.match(/^(\d부)\s*·\s*(.+)$/);
  if (m) {   // '1부' + 시간 / 다음 줄에 제목 (11/25 사용자 선택 시안 1)
    b.classList.add("two");
    const bt = el("div", "bt"), top = el("div", "b1");
    top.append(el("span", "part", m[1]));
    if (g.time) top.append(el("span", "btime", g.time));
    const ttl = el("div", "b2"); words(ttl, m[2]);
    bt.append(top, ttl);
    if (g.sub) bt.append(el("div", "b3", g.sub));   // 부제 (11/26 최종 리플렛: 1부 '권역별 우수 실행 모델 공유')
    b.append(bt);
    return b;
  }
  b.append(el("span", "bt", g.title));
  if (g.time) b.append(el("span", "btime", g.time));
  return b;
}

// 발표자·토론자: 리플렛 2쪽처럼 [좌장]/[토론] 꼬리표 + 이름 굵게·직함 연하게, 묶음별 줄 나눔
function peopleBlock(groups) {
  const box = el("div", "ppl");
  for (const g of groups) {
    const role = g.role || "발표";   // 발표자도 '발표' 꼬리표 → 통합 지정토론의 좌장·토론과 같은 모양 (시안 B, 11/25 사용자 선택)
    const row = el("div", "pg has-role");
    row.append(el("span", "role", role));
    const lines = el("div", "plines");
    for (const r of g.rows) {
      const line = el("div", "pl");
      for (const [n, t] of r) {
        const p = el("span", "pp"), nb = el("b"); highlight(nb, n, query);
        const ti = el("span", "pt"); highlight(ti, t, query);
        p.append(nb, ti); line.append(p);
      }
      lines.append(line);
    }
    row.append(lines); box.append(row);
  }
  return box;
}
const peopleText = it => (it.people || []).map(g => (g.role || "") + " " + g.rows.flat().map(x => x.join(" ")).join(" ")).join(" ");

function row(it, g) {
  const r = el("div", "item" + (it.info ? " info" : "")), tx = el("div", "txt");
  const time = g && it.time === g.time ? "" : it.time;   // 띠에 같은 시간이 있으면 생략
  if (time || it.label) {
    const tm = el("div", "tm");
    if (it.label) tm.append(el("span", "lab big", it.label));
    if (time) {
      const [st, en] = time.split("~");
      const c = el("span", "time"); c.append(el("b", null, st));
      if (en) c.append(el("i", null, "~" + en));
      // 리플렛처럼 소요 시간(10') — 시간과 한 덩어리로 묶어, 좁은 화면(큰 글씨)에서 10'만 홀로 다음 줄로 떨어지지 않게
      if (it.dur) c.append(el("span", "du", it.dur));
      tm.append(c);
    }
    r.append(tm);   // 라벨·시간 줄은 버튼 칸과 따로, 가로 전체 사용
  }
  const t = el("div", "t");
  it.title.split(String.fromCharCode(10)).forEach(seg => { const d = el("span", "seg"); highlight(d, seg, query); t.append(d); });
  tx.append(t);
  if (it.sub) { const s = el("div", "s"); highlight(s, it.sub, query); tx.append(s); }
  if (it.people) tx.append(peopleBlock(it.people));
  r.append(tx);
  if (!it.info) r.append(btns(it));
  return r;
}

function render() {
  for (const b of tabsBox.children) b.setAttribute("aria-selected", String(b.dataset.id === cur));
  main.replaceChildren();
  let shown = 0;
  main.append(pageHead("발표 자료"));
  const f = DATA.featured;
  if (f && cur === "all" && matches(f.title, query)) {
    const box = el("div", "feat"), tx = el("div", "txt");
    tx.append(el("div", "t", f.title));
    box.append(tx, btns(f)); main.append(box); shown++;
  }
  for (const g of groups) {
    if (cur !== "all" && cur !== g.id) continue;
    // 검색 중엔 자료만, 평소엔 개회·휴식 같은 시간 줄도 함께
    const hits = g.items.filter(it => query ? !it.info && matches(g.title + " " + (it.label || "") + " " + it.title + " " + (it.sub || "") + " " + peopleText(it), query) : true);
    if (!hits.length) continue;
    main.append(band(g));
    hits.forEach(it => main.append(row(it, g)));
    shown += hits.filter(it => !it.info).length;
  }
  if (!shown) main.replaceChildren();
  empty.textContent = query ? `'${query}'에 맞는 자료가 없습니다.` : "";
  empty.classList.toggle("on", shown === 0);
}

const q = document.getElementById("q"), sbox = document.getElementById("search");
q.addEventListener("input", () => {
  query = q.value.trim(); sbox.classList.toggle("has", !!q.value);
  render();
});
q.addEventListener("keydown", e => { if (e.key === "Enter") q.blur(); });
document.getElementById("clear").addEventListener("click", () => { q.value = ""; query = ""; sbox.classList.remove("has"); render(); q.focus(); });

const bar = document.getElementById("bar");
new IntersectionObserver(([e]) => bar.classList.toggle("stuck", e.intersectionRatio < 1), { threshold: [1], rootMargin: "-1px 0px 0px 0px" }).observe(bar);

render();

// 라벨 뒤 시간이 다음 줄로 넘어가면(아주 좁은 화면·큰 글씨) 줄 앞에 남는 구분선을 없앰
const markWrap = () => {
  for (const tm of main.querySelectorAll(".item > .tm")) {
    const lab = tm.querySelector(".lab"), t = tm.querySelector(".time");
    if (!lab || !t) continue;
    // 위치가 아니라 '폭'으로 판단(구분선을 지우면 한 줄에 들어가고 → 다시 넘치는 무한 반복 방지)
    const cs = getComputedStyle(t), deco = tm.classList.contains("wr") ? 0
      : parseFloat(cs.paddingLeft) + parseFloat(cs.marginLeft) + parseFloat(cs.borderLeftWidth);
    const need = lab.getBoundingClientRect().width + parseFloat(getComputedStyle(tm).columnGap || 0)
      + (t.getBoundingClientRect().width - deco) + 12;   // 12 ≈ 한 줄일 때 구분선 몫
    const wr = need > tm.clientWidth + 0.5;
    if (wr !== tm.classList.contains("wr")) tm.classList.toggle("wr", wr);
  }
};
if (window.ResizeObserver) new ResizeObserver(markWrap).observe(main); else markWrap();

// 카카오톡·네이버 등 앱 안 브라우저에서는 저장이 막히는 경우가 있어 안내
(function () {
  const ua = navigator.userAgent, box = document.getElementById("inapp");
  if (/KAKAOTALK/i.test(ua)) {
    box.append(el("div", null, "카카오톡 안에서는 파일 저장이 안 될 수 있습니다."));
    const a = el("a", null, "기본 브라우저로 열기");
    a.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
    box.append(a); box.classList.add("on");
  } else if (/NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(ua)) {
    box.append(el("div", null, "앱 안에서 열려 저장이 안 되면, 오른쪽 위 메뉴에서 '다른 브라우저로 열기'를 눌러 주세요."));
    box.classList.add("on");
  }
})();
</script>
</body>
</html>
